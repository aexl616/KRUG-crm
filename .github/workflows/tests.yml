name: KRUG tests

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'apps/miniapp/**'
      - 'supabase/migrations/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Mini App tests
        run: node --test apps/miniapp/tests/*.test.cjs
      - name: Run API unit tests
        run: node --test api/tests/*.test.cjs
