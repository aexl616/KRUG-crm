name: KRUG tests

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'tests/api/**'
      - 'tests/**'
      - 'apps/miniapp/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'crm-staff-schedule.js'
      - 'app.js'
      - 'crm-auth.js'
      - 'crm-staff-sync.js'
      - 'crm-cloud-sync.js'
      - 'crm-miniapp-sync.js'
      - 'crm-remote-booking-actions.js'
      - 'index.html'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check CRM integration scripts
        run: |
          node --check crm-auth.js
          node --check crm-staff-sync.js
          node --check crm-staff-schedule.js
          node --check crm-cloud-sync.js
          node --check crm-miniapp-sync.js
          node --check crm-remote-booking-actions.js
      - name: Run Mini App tests
        run: node --test apps/miniapp/tests/*.test.cjs
      - name: Run API unit tests
        run: node --test tests/api/*.test.cjs
      - name: Run CRM regression tests
        run: node --test tests/*.test.cjs
      - name: Install isolated SQL test engine
        run: npm install --prefix "$RUNNER_TEMP/krug-sql" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Execute migration and staff scheduling tests
        run: PGLITE_MODULE="$RUNNER_TEMP/krug-sql/node_modules/@electric-sql/pglite" node --test supabase/tests/*.test.cjs
      - name: Install isolated browser test engine
        run: |
          npm install --prefix "$RUNNER_TEMP/krug-browser" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/krug-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check CRM schedule and Mini App booking in browser
        run: |
          node tests/staff-schedule-browser.cjs "$RUNNER_TEMP/krug-browser/node_modules/playwright"
          node apps/miniapp/tests/browser.cjs "$RUNNER_TEMP/krug-browser/node_modules/playwright"
