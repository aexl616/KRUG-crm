name: KRUG tests

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'apps/miniapp/**'
      - 'supabase/migrations/**'
      - 'crm-auth.js'
      - 'crm-staff-sync.js'
      - 'crm-cloud-sync.js'
      - 'crm-miniapp-sync.js'
      - 'crm-remote-booking-actions.js'
      - 'index.html'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check CRM integration scripts
        run: |
          node --check crm-auth.js
          node --check crm-staff-sync.js
          node --check crm-cloud-sync.js
          node --check crm-miniapp-sync.js
          node --check crm-remote-booking-actions.js
      - name: Run Mini App tests
        run: node --test apps/miniapp/tests/*.test.cjs
      - name: Run API unit tests
        run: node --test api/tests/*.test.cjs
